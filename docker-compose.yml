version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    # Default is session-only, which 401s any plain HTTP basic-auth
    # request — the agent (EC2 #2) and the dashboard's paused-DAG check
    # both call the REST API this way, not through a browser session.
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth"
    PIPELINE_DB_CONN: ${PIPELINE_DB_CONN}
    PIPELINE_DB_HOST: ${PIPELINE_DB_HOST}
    PIPELINE_DB_PORT: ${PIPELINE_DB_PORT}
    PIPELINE_DB_USER: ${PIPELINE_DB_USER}
    PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
    PIPELINE_DB_NAME: ${PIPELINE_DB_NAME}
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AGENT_ALERT_URL: ${AGENT_ALERT_URL}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./dbt_project:/opt/airflow/dbt_project
    - airflow_logs:/opt/airflow/logs
    - ~/.aws:/home/airflow/.aws:ro

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      PIPELINE_DB_CONN: ${PIPELINE_DB_CONN}
      # Docker-internal service DNS, not ${AIRFLOW_API_URL} — that env
      # var is the *public* endpoint EC2 #2 (a separate host) needs;
      # streamlit and airflow-webserver share this compose file's
      # network, so the service name is the correct, direct route.
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD}
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      - airflow-webserver

volumes:
  airflow_logs:
