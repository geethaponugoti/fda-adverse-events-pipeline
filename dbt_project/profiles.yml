fda_pipeline:
  target: dev
  outputs:
    dev:
      type:     postgres
      host:     "{{ env_var('PIPELINE_DB_HOST') }}"
      user:     "{{ env_var('PIPELINE_DB_USER') }}"
      password: "{{ env_var('PIPELINE_DB_PASSWORD') }}"
      port:     "{{ env_var('PIPELINE_DB_PORT') | as_number }}"
      dbname:   "{{ env_var('PIPELINE_DB_NAME') }}"
      schema:   staging
      threads:  4
